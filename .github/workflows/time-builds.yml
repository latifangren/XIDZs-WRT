# =====================================================================
# PENJELASAN JADWAL WAKTU (CRON FORMAT)
# =====================================================================
# Format cron menggunakan 5 tanda bintang (* * * * *):
# ┌───────────── Menit (0 - 59)
# │ ┌───────────── Jam (0 - 23) -> Perhatikan: Ini menggunakan zona waktu UTC!
# │ │ ┌───────────── Tanggal (1 - 31)
# │ │ │ ┌───────────── Bulan (1 - 12)
# │ │ │ │ ┌───────────── Hari dalam seminggu (0 - 6) (Minggu = 0)
# │ │ │ │ │
# * * * * *
# 
# CONTOH PENJADWALAN:
# '0 17 1 1,7 *'   -> Menit 0, Jam 17:00 UTC (00:00 WIB esok harinya), Tanggal 1, Bulan Jan & Jul, Hari apapun.
# '30 22 * * 5'    -> Menit 30, Jam 22:30 UTC (05:30 WIB), Setiap tanggal, Setiap bulan, Hari Jumat.
# '0 17 1 * *'     -> Menit 0, Jam 17:00 UTC (00:00 WIB), Tanggal 1, Setiap bulan.
# =====================================================================
# JADWAL EKSEKUSI SPESIFIK (Jarak 13 Jam) - Target Tahun 2026
# Job A (ophub): 20 Agustus, 15:00 WIB -> 08:00 UTC
# Job B (ulo):   21 Agustus, 04:00 WIB -> 21:00 UTC (Tgl 20)
# Job C (offc):  21 Agustus, 17:00 WIB -> 10:00 UTC
# Job D (opt):   22 Agustus, 06:00 WIB -> 23:00 UTC (Tgl 21)
# =====================================================================

name: Scheduled builds Jobs (13h jam)

on:
  schedule:
    - cron: '0 8 20 8 *'
    - cron: '0 21 20 8 *'
    - cron: '0 10 21 8 *'
    - cron: '0 23 21 8 *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  job-a:
    name: Job A (all-devices-ophub)
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 8 20 8 *'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Trigger Builds.yml - OPHUB
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$(date +'%Y')" != "2026" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            exit 0
          fi
          
          gh workflow run Builds.yml \
            -f release_branch="openwrt:25.12.5" \
            -f rootfs_size="1024" \
            -f target="all-devices-ophub" \
            -f tunnel="all-tunnel-v2" \
            -f clean="true"

  job-b:
    name: Job B (all-devices-ulo)
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 21 20 8 *'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Trigger Builds.yml - ULO
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$(date +'%Y')" != "2026" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            exit 0
          fi
          
          gh workflow run Builds.yml \
            -f release_branch="openwrt:25.12.5" \
            -f rootfs_size="1024" \
            -f target="all-devices-ulo" \
            -f tunnel="all-tunnel-v2" \
            -f clean="true"

  job-c:
    name: Job C (all-devices-official)
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 10 21 8 *'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Trigger Builds.yml - OFFICIAL
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$(date +'%Y')" != "2026" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            exit 0
          fi
          
          gh workflow run Builds.yml \
            -f release_branch="openwrt:25.12.5" \
            -f rootfs_size="1024" \
            -f target="all-devices-official" \
            -f tunnel="all-tunnel-v2" \
            -f clean="true"

  job-d:
    name: Job D (opt-devices-official)
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 23 21 8 *'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Trigger Builds.yml - OPT OFFICIAL
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$(date +'%Y')" != "2026" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            exit 0
          fi
          
          gh workflow run Builds.yml \
            -f release_branch="openwrt:25.12.5" \
            -f rootfs_size="1024" \
            -f target="opt-devices-official" \
            -f tunnel="all-tunnel-v2" \
            -f clean="true"
